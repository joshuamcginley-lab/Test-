<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin · fishr.ai</title>
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
:root{--bg:#070A14;--solid:#0F1322;--line:rgba(255,255,255,.1);--ink:#EEF2E8;--muted:#8D96A3;--v:#C4FF2E;--bad:#FF5470;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 64px}
main{max-width:860px;margin:0 auto;display:grid;gap:18px}
h1{font-size:30px;letter-spacing:-.04em;margin:0}
.card{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;min-width:0}
.k{font:500 11px/1.3 "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font:600 40px/1 "Geist Mono",monospace;letter-spacing:-.04em}
input{font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);flex:1 1 220px}
button{font:600 14px/1 Geist,system-ui,sans-serif;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:none;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;min-width:0}
.err b{color:var(--bad);word-break:break-word}
.err pre{white-space:pre-wrap;word-break:break-word;font:12px/1.45 "Geist Mono",monospace;color:var(--muted);margin:6px 0 0;max-height:160px;overflow:auto}
.muted{color:var(--muted)}
#msg{color:var(--bad);min-height:1em;margin:0}
</style>
</head>
<body>
<main>
  <h1>fishr admin</h1>
  <div class="card">
    <span class="k">Admin key</span>
    <form class="row" id="keyForm"><input type="password" id="key" placeholder="The ADMIN_KEY you set in Cloudflare" autocomplete="current-password"><button type="submit">Unlock</button><button type="button" class="ghost" id="forget">Forget key</button></form>
    <p id="msg"></p>
  </div>
  <div id="panels" hidden style="display:grid;gap:18px">
    <div class="card">
      <span class="k">fishr Pro waitlist</span>
      <div class="big" id="wlCount">—</div>
      <div class="row"><button id="csv">Download sign-ups (CSV)</button><span class="muted">Includes each person's consent and their one-tap unsubscribe link. Paste that link into every email you send.</span></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><span class="k">Recent crash reports (kept 90 days)</span><button class="ghost" id="reload">Refresh</button></div>
      <div id="errs" class="muted">Loading…</div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let key = ""; try { key = localStorage.getItem("fishr-admin") || ""; } catch (e) {}
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), "x-admin-key": key } });

async function unlock() {
  $("msg").textContent = "";
  const r = await api("/api/errors").catch(() => null);
  if (!r || r.status === 403) { $("msg").textContent = r ? "That key didn't work." : "No connection."; $("panels").hidden = true; return; }
  try { localStorage.setItem("fishr-admin", key); } catch (e) {}
  $("panels").hidden = false;
  showErrors(await r.json());
  const c = await (await fetch("/api/waitlist")).json().catch(() => ({}));
  $("wlCount").textContent = (c.count ?? 0).toLocaleString();
}
function showErrors(d) {
  const list = d.errors || [];
  $("errs").innerHTML = list.length ? list.map(e => `<div class="err"><b>${esc(e.msg)}</b><div class="muted">${esc(new Date(e.at).toLocaleString())} · v${esc(e.version)} · ${esc(e.src)}${e.line ? ":" + e.line : ""} · ${esc(e.country || "")} · ${esc(e.screen || "")}</div><div class="muted">${esc(e.ua)}</div>${e.stack ? `<pre>${esc(e.stack)}</pre>` : ""}</div>`).join("") : "No crashes reported. Nice.";
}
$("keyForm").onsubmit = e => { e.preventDefault(); key = $("key").value.trim(); unlock(); };
$("forget").onclick = () => { key = ""; $("key").value = ""; try { localStorage.removeItem("fishr-admin"); } catch (e) {} $("panels").hidden = true; };
$("reload").onclick = async () => showErrors(await (await api("/api/errors")).json());
$("csv").onclick = async () => {
  const r = await api("/api/waitlist?export=csv");
  if (!r.ok) { $("msg").textContent = "Couldn't export."; return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = `fishr-waitlist-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.append(a); a.click(); a.remove();
};
if (key) unlock();
</script>
</body>
</html>
