name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        run: npm install --prefix tests && npx --prefix tests playwright install --with-deps chromium
      - name: Run all tests
        run: node tests/run.mjs
